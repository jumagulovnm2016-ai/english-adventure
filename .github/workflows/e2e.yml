# Сквозные тесты в настоящем Chrome: управление, квесты, весь городок, родители, офлайн, доступность, скорость.
name: Сквозные тесты

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run test:perf
        env:
          CHROME: /usr/bin/google-chrome
